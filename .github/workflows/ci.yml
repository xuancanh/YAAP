name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR branch).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: this workflow only reads the repo.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Pinned to a full-length commit SHA for supply-chain safety.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx eslint server/src src tests scripts
      # Drift check: regenerate the authored market packs from packs/*.md and
      # fail if the committed output is stale. profession-packs.generated.ts
      # is not covered — it builds from an external knowledge-work-plugins
      # checkout that CI doesn't have.
      - run: |
          npm run packs:build
          git diff --exit-code server/src/market/
      - run: npm run build
      # Backend suites run on PGlite (in-memory Postgres) — no services needed.
      - run: npm test
      # Frontend unit tests (vitest + jsdom, web-tests/).
      - run: npm run test:web
