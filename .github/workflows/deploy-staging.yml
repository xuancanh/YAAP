name: Deploy Staging

# Runs after CI succeeds on main. NOTE: workflow_run always executes the
# version of this file from the default branch, and github.sha here points at
# the triggering CI run's commit.
on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]

concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy-frontend:
    # Only deploy when the CI run actually succeeded.
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The frontend talks to the API on the same origin at /api
      # (src/lib/api.ts) — no VITE_API_URL or other build-time env is needed.
      - run: npm run build

      # wrangler.toml is maintained separately at infra/cloudflare/wrangler.toml.
      # Required environment-scoped secrets (GitHub env "staging"):
      #   CLOUDFLARE_API_TOKEN   — API token with Workers/Pages edit rights
      #   CLOUDFLARE_ACCOUNT_ID  — Cloudflare account ID
      - name: Deploy frontend to Cloudflare
        uses: cloudflare/wrangler-action@da0e0dfe58b7a431659754fdf3f186c529afbe65 # v3.14.1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --env staging -c infra/cloudflare/wrangler.toml

  deploy-api:
    # SKELETON — not a working deploy yet. Fills in once a staging host exists.
    # Requires (GitHub env "staging"):
    #   vars.STAGING_HOST        — hostname/IP of the staging server
    #   secrets.STAGING_SSH_KEY  — private key for the deploy user
    # Optionally vars.STAGING_SSH_USER (defaults to "deploy") and
    # vars.STAGING_APP_DIR (defaults to /opt/yaam-chat).
    if: ${{ github.event.workflow_run.conclusion == 'success' && vars.STAGING_HOST != '' }}
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Pull and restart API container over SSH
        uses: appleboy/ssh-action@2ead5e36573f08b82fbfce1504f1a4b05a647c6f # v1.2.2
        with:
          host: ${{ vars.STAGING_HOST }}
          username: ${{ vars.STAGING_SSH_USER || 'deploy' }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            set -e
            cd ${{ vars.STAGING_APP_DIR || '/opt/yaam-chat' }}
            docker compose pull
            docker compose up -d
