version: 2
updates:
  # Root package.json (also covers server/ via the root lockfile setup).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
    groups:
      # Roll all minor/patch bumps into a single PR to cut noise;
      # major bumps still get their own PRs.
      minor-patch:
        update-types: [minor, patch]

  # Keep pinned GitHub Actions SHAs current (dependabot bumps the SHA
  # and the "# vX.Y.Z" comment together).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci

  # Root multi-stage Dockerfile (base image bumps).
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: docker
